<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 全天星空天球模擬器．中國星官版</title>
    <meta name="description" content="以中國傳統星官命名的全天星空模擬器，含天球經緯線與寫實星體特效（88 星座資料庫）">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: rgba(100, 180, 255, 0.6);
            --bg-dark: #02040a;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --accent: #7aa2f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: var(--bg-dark); 
            font-family: 'Outfit', 'Noto Sans TC', sans-serif; 
            color: #e0e8ff; 
            user-select: none;
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #ui-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        header { text-align: center; }
        header h1 { 
            font-size: 1.4rem; 
            font-weight: 700; 
            letter-spacing: 3px;
            background: linear-gradient(to right, #89ddff, #c0caf5, #bb9af7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        header p { font-size: 0.9rem; color: #565f89; letter-spacing: 3px; }

        #star-label {
            position: fixed;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -150%);
            transition: opacity 0.2s;
        }
        .label-content {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(122, 162, 247, 0.4);
            border-radius: 12px;
            padding: 8px 20px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--primary-glow);
        }
        .label-name { font-size: 1rem; font-weight: 600; color: #fff; text-shadow: 0 0 8px var(--primary-glow); }
        .label-coords { font-size: 0.7rem; color: #7aa2f7; margin-top: 2px; }

        #bottom-controls {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            width: 100%;
        }

        #sub-menu, #const-submenu {
            display: none;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 12px;
            max-width: 90vw;
            overflow-x: auto;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .star-grid { display: flex; gap: 8px; }
        .star-item, .const-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.85rem;
            color: #a9b1d6;
        }
        .star-item:hover, .const-item:hover { 
            background: rgba(122, 162, 247, 0.2); 
            border-color: #7aa2f7; 
            color: #fff;
            transform: translateY(-4px);
        }
        .star-item.active, .const-item.active { background: #7aa2f7; color: #1a1b26; border-color: #fff; font-weight: 600; }
        /* 星座子選單項目用不同色系區分（琥珀色系）*/
        .const-item { border-color: rgba(224, 175, 104, 0.25); }
        .const-item:hover { background: rgba(224, 175, 104, 0.2); border-color: #e0af68; }
        .const-item.active { background: #e0af68; color: #1a1b26; border-color: #fff; }

        #const-menu {
            display: flex;
            gap: 8px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 95vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        #const-menu::-webkit-scrollbar { display: none; }
        .const-btn {
            background: transparent;
            border: none;
            color: #787c99;
            padding: 8px 16px; white-space: nowrap; font-size: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.4s;
            letter-spacing: 1px;
        }
        .const-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
        .const-btn.active { 
            background: linear-gradient(135deg, #7aa2f7, #bb9af7);
            color: #fff;
            box-shadow: 0 0 20px rgba(122, 162, 247, 0.4);
        }

        #info-panel { display: none; }

        /* 星體詳細資料面板 - 手機版 Bottom Sheet */
        #detail-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(8, 12, 28, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(122, 162, 247, 0.3);
            border-radius: 24px 24px 0 0;
            padding: 24px 24px 40px;
            pointer-events: auto;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            z-index: 20;
            display: flex;
            flex-direction: column;
        }
        #detail-panel.visible { transform: translateY(0); }
        .dp-drag-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            margin: -10px auto 16px;
        }
        .dp-close {
            position: absolute;
            top: 16px;
            right: 24px;
            font-size: 24px;
            color: rgba(255,255,255,0.5);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .dp-close:hover { color: white; }
        .dp-type {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .dp-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .dp-divider {
            height: 1px;
            background: linear-gradient(to right, rgba(122,162,247,0.5), transparent);
            margin: 12px 0;
        }
        .dp-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            font-size: 0.78rem;
        }
        .dp-label { color: #565f89; }
        .dp-value { color: #c0caf5; font-weight: 600; }
        #dp-west { font-size: 0.72rem; text-align: right; max-width: 65%; }
        .dp-desc {
            margin-top: 14px;
            font-size: 0.75rem;
            color: #787c99;
            line-height: 1.6;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 12px;
        }

        /* 夏季大三角 badge */
        .summer-triangle-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255,200,60,0.2), rgba(255,160,30,0.15));
            border: 1px solid rgba(255,200,60,0.4);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.65rem;
            color: #ffc83c;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* Scrollbar styling */
        #sub-menu::-webkit-scrollbar, #const-submenu::-webkit-scrollbar { height: 4px; }
        #sub-menu::-webkit-scrollbar-track, #const-submenu::-webkit-scrollbar-track { background: transparent; }
        #sub-menu::-webkit-scrollbar-thumb, #const-submenu::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        /* 分類大標題按鈕（最底層）與星座小標題有所區隔 */
        .category-btn { position: relative; }
        .category-btn::after {
            content: '›';
            margin-left: 4px;
            opacity: 0.6;
            font-weight: 400;
        }
        .category-btn.active::after { opacity: 1; }
    </style>
</head>

        // --- 寫實貼圖生成 (Procedural) ---
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.1, 'rgba(255,255,255,0.8)');
            grd.addColorStop(0.2, 'rgba(255,255,255,0.2)');
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, 128, 128);
            // 十字光芒
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(64, 10); ctx.lineTo(64, 118); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10, 64); ctx.lineTo(118, 64); ctx.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        function createNebulaTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            for(let i=0; i<30; i++) {
                const x = 128 + (Math.random()-0.5)*100;
                const y = 128 + (Math.random()-0.5)*100;
                const r = 20 + Math.random()*60;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(255,255,255,0.05)');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- 座標轉換 ---
        function calculatePosition(ra, dec, radius) {
            const phi = (90 - dec) * (Math.PI / 180);
            const theta = (ra + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

            const y = sphereRadius * Math.sin(d * Math.PI / 180);
            const points = [];
            for(let i=0; i<=64; i++) {
                const ang = (i/64) * Math.PI * 2;
                points.push(new THREE.Vector3(radius * Math.cos(ang), y, radius * Math.sin(ang)));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: 0x4488bb, transparent: true, opacity: 0.55 });
            gridGroup.add(new THREE.Line(geo, mat));

            const geo = new THREE.BufferGeometry().setFromPoints(points);

                }
                
                obj.position.copy(pos);
                scene.add(obj);
                
                const entry = { mesh: obj, data: s, ci, si };

            const lineIndexPairs = con.lines && con.lines.length

            equuleus:              "秋季星空",
            sagitta:               "夏季星空",
            vulpecula:             "夏季星空",
            orion:                 "冬季星空",
            canis_major:           "冬季星空",
            carina:                "南天星座",
            centaurus:             "南天星座",
            crux:                  "南天星座",
            eridanus:              "冬季星空",
            columba:               "冬季星空",
            piscis_austrinus:      "秋季星空",
            pavo:                  "南天星座",
            grus:                  "南天星座",
            puppis:                "冬季星空",
            vela:                  "南天星座",
            fornax:                "冬季星空",
            cetus:                 "秋季星空",
            phoenix:               "南天星座",
            hydra:                 "春季星空",
            crater:                "春季星空",
            corvus:                "春季星空",
            lupus:                 "南天星座",
            corona_australis:      "夏季星空",
            ara:                   "南天星座",
            scutum:                "夏季星空",
            octans:                "極南星座",
            hydrus:                "極南星座",
            dorado:                "南天星座",
            volans:                "極南星座",
            chamaeleon:            "極南星座",
            musca:                 "極南星座",
            apus:                  "極南星座",
            norma:                 "南天星座",
            circinus:              "南天星座",
            telescopium:           "南天星座",
            microscopium:          "秋季星空",
            caelum:                "冬季星空",
            horologium:            "南天星座",
            pictor:                "南天星座",
            reticulum:             "南天星座",
            indus:                 "南天星座",
            tucana:                "南天星座",
            mensa:                 "極南星座",
            sculptor:              "秋季星空",
            pyxis:                 "春季星空",
            antlia:                "春季星空",
            sextans:               "春季星空",
            monoceros:             "冬季星空",
            lepus:                 "冬季星空",
            triangulum:            "秋季星空",
            triangulum_australe:   "南天星座"
        };

        function categorize(con) {
            if(ZODIAC_IDS.includes(con.id)) return '黃道十二宮';
            return CONST_CATEGORY[con.id] || '秋季星空';
        }

        const CATEGORIES = {};
        CATEGORY_ORDER.forEach(c => CATEGORIES[c] = []);
        CONSTELLATIONS.forEach((con, ci) => {
            const cat = categorize(con);
            if(!CATEGORIES[cat]) CATEGORIES[cat] = [];
            CATEGORIES[cat].push(ci);
        });
        // 反查表：星座索引 ci -> 所屬分類名稱
        const CI_TO_CATEGORY = {};
        Object.entries(CATEGORIES).forEach(([cat, list]) => list.forEach(ci => CI_TO_CATEGORY[ci] = cat));

        // --- 鏡頭自動轉向：沿球面大圓弧平滑飛向指定方向 ---
        // 改用「方向向量球面插值 (slerp)」而非直線移動相機位置：
        // 直線移動時，若起點與終點方向接近相反，中途會經過球心附近，
        // 導致 lookAt() 瞬間方向計算失真，感覺像是「轉到後面去了」。
        // 球面插值全程與地球中心保持等距，沿最短弧線平滑轉動，不會有這個問題。
        let flyAnimId = null;
        function slerpVectors(v0, v1, t) {
            const dot = THREE.MathUtils.clamp(v0.dot(v1), -1, 1);
            const omega = Math.acos(dot);
            if (omega < 1e-4) return v0.clone(); // 方向幾乎相同，不需轉動
            const sinOmega = Math.sin(omega);
            if (sinOmega < 1e-4) {
                // 接近正相反方向（180°），退回線性插值作為安全備案
                return v0.clone().lerp(v1, t).normalize();
            }
            const s0 = Math.sin((1 - t) * omega) / sinOmega;
            const s1 = Math.sin(t * omega) / sinOmega;
            return v0.clone().multiplyScalar(s0).add(v1.clone().multiplyScalar(s1));
        }
        function flyToDirection(dir, targetDist) {
            if(flyAnimId) cancelAnimationFrame(flyAnimId);
            const curDist = Math.max(camera.position.length(), 5);
            // targetDist 有給的話代表「至少要飛到這麼近」（不會比現在更遠），沒給就保持目前縮放距離
            const dist = targetDist !== undefined ? Math.min(curDist, targetDist) : curDist;
            const startDir = camera.position.clone().normalize();
            const endDir = dir.clone().normalize().multiplyScalar(-1); // 鏡頭停在目標方向的正對面，朝向目標看
            const startTime = performance.now();
            const duration = 700;
            controls.enabled = false;
            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic
                const curDir = slerpVectors(startDir, endDir, ease);
                const curFrameDist = curDist + (dist - curDist) * ease; // 距離也一起平滑過渡
                camera.position.copy(curDir.multiplyScalar(curFrameDist));
                camera.lookAt(0, 0, 0);
                if(t < 1) {
                    flyAnimId = requestAnimationFrame(step);
                } else {
                    controls.enabled = true;
                    flyAnimId = null;
                }
            }
            flyAnimId = requestAnimationFrame(step);
        }
        function flyToConstellation(ci) {
            const entries = starEntries.filter(e => e.ci === ci);
            if(!entries.length) return;
            const avg = new THREE.Vector3();
            entries.forEach(e => avg.add(e.mesh.position));
            avg.divideScalar(entries.length);
            flyToDirection(avg);
        }

        function selectStar(entry) {
            selectedEntry = entry;
            const s = entry.data;

            // 選取光圈
            selectionRing.position.copy(entry.mesh.position);
            selectionRing.lookAt(0,0,0);
            ringMat.opacity = 0.8;

            // 懸浮小標籤 (手機版隱藏或移至不擋手處)
            label.style.display = 'none'; // 手機版直接用 Bottom Sheet 就好
            lName.textContent   = s.name;
            lCoords.textContent = `RA: ${s.ra}° | Dec: ${s.dec}°`;
            label.style.display = 'block';

            // 右側詳細面板
            document.getElementById('dp-type').textContent = TYPE_LABEL[s.type] || s.type;
            document.getElementById('dp-type').style.color = TYPE_COLOR[s.type] || '#c0caf5';
            document.getElementById('dp-name').textContent = s.name;

            // 夏季大三角 badge
            const badge = document.getElementById('dp-badge');
            badge.innerHTML = SUMMER_TRIANGLE.includes(s.name)
                ? '<span class="summer-triangle-badge">△ 夏季大三角</span>' : '';

            const westRow = document.getElementById('dp-west-row');
            if(s.west) {
                westRow.style.display = 'flex';
                document.getElementById('dp-west').textContent = s.west;
            } else { westRow.style.display = 'none'; }

            const hipRow = document.getElementById('dp-hip-row');
            if(s.hip) {
                hipRow.style.display = 'flex';
                document.getElementById('dp-hip').textContent = 'HIP ' + s.hip;
            } else { hipRow.style.display = 'none'; }

            document.getElementById('dp-ra').textContent   = s.ra + '°';
            document.getElementById('dp-dec').textContent  = s.dec + '°';

            const magRow  = document.getElementById('dp-mag-row');
            const distRow = document.getElementById('dp-dist-row');
            if(s.mag !== undefined) {
                magRow.style.display = 'flex';
                document.getElementById('dp-mag').textContent = s.mag;
            } else { magRow.style.display = 'none'; }

            if(s.dist) {
                distRow.style.display = 'flex';
                document.getElementById('dp-dist').textContent = s.dist;
            } else { distRow.style.display = 'none'; }

            document.getElementById('dp-desc').textContent = s.desc || '';
            detailPanel.classList.add('visible');

            // 旋轉中心永遠保持地球中心
            controls.target.set(0, 0, 0);

            // 鏡頭飛近並置中這顆星（比星座整體視角再拉近一點，但不會比目前更遠）
            flyToDirection(entry.mesh.position, 25);

            // Highlight sub-btn
            document.querySelectorAll('.star-item').forEach(b => b.classList.toggle('active', b.dataset.si == entry.si));
        }

        function toggleSummerTriangle() {
            summerTriangleActive = !summerTriangleActive;
            stLineMat.opacity = summerTriangleActive ? 0.8 : 0;
            document.getElementById('st-btn').classList.toggle('active', summerTriangleActive);

            if(summerTriangleActive) {
                // 展開子選單：三顆頂點星
                starBtns.innerHTML = '';
                SUMMER_TRIANGLE.forEach(name => {
                    const entry = starEntries.find(e => e.data.name === name);
                    if(!entry) return;
                    const div = document.createElement('div');
                    div.className = 'star-item';
                    div.textContent = name;
                    div.onclick = () => selectStar(entry);
                    starBtns.appendChild(div);
                });
                subMenu.style.display = 'block';
                // 取消其他星座的 active
                activeCi = -1;
                constGroups.forEach(g => g.material.opacity = 0);
                document.querySelectorAll('.const-item').forEach(b => b.classList.remove('active'));

                // 自動轉向夏季大三角中心
                const avg = new THREE.Vector3();
                stPositions.forEach(p => avg.add(p));
                avg.divideScalar(stPositions.length);
                flyToDirection(avg);
            } else {
                subMenu.style.display = 'none';
            }
        }

        function toggleConst(ci) {
            // 關閉夏季大三角
            summerTriangleActive = false;
            stLineMat.opacity = 0;
            document.getElementById('st-btn').classList.remove('active');

            if(activeCi === ci) {
                activeCi = -1;
                subMenu.style.display = 'none';
                label.style.display = 'none';
                ringMat.opacity = 0;
                detailPanel.classList.remove('visible');
                constGroups.forEach(g => g.material.opacity = 0);
                document.querySelectorAll('.const-item').forEach(b => b.classList.remove('active'));
                return;
            }
            activeCi = ci;
            constGroups.forEach((g, i) => g.material.opacity = (i === ci ? 0.75 : 0));

            // 確保該星座所屬的分類子選單已展開，並同步高亮
            const cat = CI_TO_CATEGORY[ci];
            if(cat && activeCategory !== cat) showCategory(cat);
            document.querySelectorAll('.const-item').forEach(b => b.classList.toggle('active', Number(b.dataset.ci) === ci));

            // Sub menu（星體清單）
            starBtns.innerHTML = '';
            CONSTELLATIONS[ci].stars.forEach((s, si) => {
                const div = document.createElement('div');
                div.className = 'star-item';
                div.dataset.si = si;
                div.textContent = s.name;
                div.onclick = () => selectStar(starEntries.find(e => e.ci === ci && e.si === si));
                starBtns.appendChild(div);
            });
            subMenu.style.display = 'block';

            // 自動將鏡頭轉向該星座
            flyToConstellation(ci);
        }

        // --- 分類子選單（小標題：該分類底下的星座列表）---
        function showCategory(catName) {
            activeCategory = catName;
            constBtns.innerHTML = '';
            (CATEGORIES[catName] || []).forEach(ci => {
                const div = document.createElement('div');
                div.className = 'const-item';
                div.dataset.ci = ci;
                div.textContent = CONSTELLATIONS[ci].name;
                div.classList.toggle('active', ci === activeCi);
                div.onclick = () => toggleConst(ci);
                constBtns.appendChild(div);
            });
            constSubMenu.style.display = 'block';
            document.querySelectorAll('.category-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === catName));
        }

        function toggleCategory(catName) {
            if(activeCategory === catName) {
                activeCategory = null;
                constSubMenu.style.display = 'none';
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                return;
            }
            showCategory(catName);
        }

        // 建立底部按鈕：分類大標題（點擊後展開該分類的星座小標題）+ 夏季大三角（特別標記）
        CATEGORY_ORDER.filter(cat => CATEGORIES[cat] && CATEGORIES[cat].length).forEach(catName => {
            const btn = document.createElement('button');
            btn.className = 'const-btn category-btn';
            btn.dataset.cat = catName;
            btn.textContent = `${catName} (${CATEGORIES[catName].length})`;
            btn.onclick = () => toggleCategory(catName);
            constMenu.appendChild(btn);
        });
        // 夏季大三角按鈕
        const stBtn = document.createElement('button');
        stBtn.className = 'const-btn';
        stBtn.id = 'st-btn';
        stBtn.textContent = '△ 夏季大三角';
        stBtn.style.borderLeft = '1px solid rgba(255,200,60,0.3)';
        stBtn.style.marginLeft = '4px';
        stBtn.onclick = toggleSummerTriangle;
        constMenu.appendChild(stBtn);

        // --- 拖曳時關閉慣性，放手後恢復 ---
        renderer.domElement.addEventListener('pointerdown', () => {
            controls.enableDamping = false;
        });
        renderer.domElement.addEventListener('pointerup', () => {
            controls.enableDamping = true;
        });

        // --- Raycasting (click) ---
        // 使用螢幕投影距離來判斷點擊，Sprite 物件的 intersect 不穩定
        let pointerMoved = false;
        renderer.domElement.addEventListener('pointermove', () => { pointerMoved = true; });
        renderer.domElement.addEventListener('pointerdown', () => { pointerMoved = false; });

        window.addEventListener('click', (e) => {
            if(pointerMoved) return;
            // 螢幕像素座標 → NDC 標準設備座標 (-1 ~ 1)
            const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;

            // 找最近的星體（螢幕空間距離）
            let bestEntry = null;
            let bestDist = Infinity;
            const clickPos = new THREE.Vector2(ndcX, ndcY);

            starEntries.forEach(entry => {
                const v = entry.mesh.position.clone().project(camera);
                if(v.z > 1) return; // 在攝影機背面
                const screenDist = clickPos.distanceTo(new THREE.Vector2(v.x, v.y));
                if(screenDist < bestDist) {
                    bestDist = screenDist;
                    bestEntry = entry;
                }
            });

            // 閾值：NDC 空間中 0.06 約等於螢幕上 ~40px
            if(bestEntry && bestDist < 0.06) {
                if(bestEntry.ci !== activeCi) toggleConst(bestEntry.ci);
                selectStar(bestEntry);
            }
        });

        // --- 渲染迴圈 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Label mapping
            if(selectedEntry) {
                const v = selectedEntry.mesh.position.clone().project(camera);
                const x = (v.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
                label.style.left = `${x}px`;
                label.style.top = `${y}px`;
                label.style.opacity = v.z > 1 ? 0 : 1;

                selectionRing.scale.setScalar(1 + Math.sin(Date.now()*0.005)*0.1);
            }
            
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Line2 粗線材質需要同步視窗解析度才能維持正確的像素寬度
            lineMaterials.forEach(m => m.resolution.set(window.innerWidth, window.innerHeight));
        });
    </script>
